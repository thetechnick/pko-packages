apiVersion: manifests.package-operator.run/v1alpha1
kind: PackageManifest
metadata:
  creationTimestamp: null
  name: keycloak
spec:
  phases:
  - name: deploy
  availabilityProbes:
  - probes:
    - fieldsEqual:
        fieldA: .status.updatedReplicas
        fieldB: .status.replicas
    - fieldsEqual:
        fieldA: .status.availableReplicas
        fieldB: .status.replicas
    selector:
      kind:
        group: apps
        kind: StatefulSet
  config:
    openAPIV3Schema:
      properties:
        hostname:
          type: string
        clusterIssuer:
          type: string
        databaseSecretName:
          type: string
        databaseHost:
          type: string
      required:
      - hostname
      - clusterIssuer
      - databaseSecretName
      - databaseHost
      type: object
  filter: {}
  images: null
  scopes:
  - Namespaced
test:
  kubeconform:
    kubernetesVersion: v1.30.2
  template:
  - context:
      package:
        image: registry.package-operator.run/static-image
        metadata:
          name: keycloak
      config:
        hostname: sso.thetechnick.ninja
        clusterIssuer: le-prod
        databaseSecretName: test-secret
        databaseHost: test.db.example.com
    name: no-config