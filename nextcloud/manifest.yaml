apiVersion: manifests.package-operator.run/v1alpha1
kind: PackageManifest
metadata:
  creationTimestamp: null
  name: nextcloud
spec:
  components: {}
  phases:
  - name: deploy
  config:
    openAPIV3Schema:
      properties:
        hostname:
          type: string
        clusterIssuer:
          type: string
        databaseHost:
          type: string
        databaseName:
          type: string
          default: nextcloud
        databaseSecretName:
          type: string
        storage:
          type: object
          default:
            hostDir: {}
          properties:
            hostDir:
              type: object
            pvc:
              type: object
              properties:
                storageClassName:
                  type: string
                dataStorage:
                  type: string 
      required:
      - hostname
      - clusterIssuer
      - storage
      - databaseSecretName
      - databaseHost
      type: object
  filter: {}
  images:
  - name: nextcloud
    image: docker.io/nextcloud:31.0.9-apache
  - name: redis
    image: docker.io/redis:7.2-alpine
  scopes:
  - Namespaced
test:
  kubeconform:
    kubernetesVersion: v1.28.2
  template:
  - name: hostdir
    context:
      config:
        storage:
          hostDir: {}
        hostname: cloud.package-operator.run
        clusterIssuer: letsencrypt-prod
        databaseHost: test.database.example.com
        databaseSecretName: test
      package:
        metadata:
          name: test
          namespace: test-ns
  - name: pvc
    context:
      config:
        storage:
          pvc:
            storageClassName: fast
            dataStorage: 1T
        hostname: cloud.package-operator.run
        clusterIssuer: letsencrypt-prod
        databaseHost: test.database.example.com
        databaseSecretName: test
      package:
        metadata:
          name: test
          namespace: test-ns